<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Priscirah's Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Me</a></li>
                    <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-title">
        <h1>My Gallery</h1>
        <p>Some pictures and a video I like.</p>
    </div>

    <div class="container my-4">
        <div class="simple-card mb-4">
            <h2>My Motivational Video</h2>
            <video controls width="100%" style="max-height: 420px;">
                <source src="video/my-video.mp4" type="video/mp4">
                Your browser does not support this video.
            </video>
        </div>

        <div class="simple-card">
            <h2>My Photos</h2>
            <p>My Pictures.</p>
            <div class="row g-3">
                <div class="col-md-4">
                    <img class="gallery-image" src="images/photo1.jpg" alt="My first photo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                    <p class="photo-placeholder"></p>
                    <p class="photo-caption">Headshot</p>
                </div>
                <div class="col-md-4">
                    <img class="gallery-image" src="images/photo2.jpg" alt="My second photo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                    <p class="photo-placeholder"></p>
                    <p class="photo-caption">campus activities</p>
                </div>
                <div class="col-md-4">
                    <img class="gallery-image" src="images/photo3.jpg" alt="My third photo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                    <p class="photo-placeholder">Add images/photo3.jpg here</p>
                    <p class="photo-caption">project screeshot.</p>
                </div>
            </div>
        </div>
    </div>

    <footer><p>Made by Priscirah| 2026</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
