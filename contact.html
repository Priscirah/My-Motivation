    <div class="page-title">
        <h1>Contact Me 💌</h1>
        <p>You can reach me using the details below.</p>
    </div>

    <div class="container my-4">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="simple-card">
                    <h2>My Details</h2>
                    <p><strong>Email:</strong><br><a href="mailto:p65587889@gmail.com">p65587889@gmail.com</a></p>
                    <p><strong>Location:</strong><br>Kampala, Uganda</p>
                    <p><strong>GitHub:</strong><br><a href="https://github.com/Priscirah">Priscirah</a></p>
                </div>
            </div>
            <div class="col-md-7">
                <div class="simple-card">
                    <h2>Send Me a Message ✉️</h2>
                    <form onsubmit="event.preventDefault(); alert('This is only a sample form. It is not connected to email yet.');">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" id="subject" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" class="form-control" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn cute-button">Send Message 💗</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
